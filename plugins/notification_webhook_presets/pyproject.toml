[project]
name = "hegemony-notification-webhook-presets"
version = "0.3.3"
description = "Webhook-based notification presets (Webex, Microsoft Teams) for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = ["hegemony-notification-sdk==0.3.3"]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-notification-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-notification-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-notification-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.notification_providers"]
webhook_presets = "hegemony_notification_webhook_presets:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_notification_webhook_presets"
module-root = "src"
